name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tallybook-release.jks"
          test -s "$RUNNER_TEMP/tallybook-release.jks"

      - name: Verify keystore credentials
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/tallybook-release.jks" \
            -storepass:env SIGNING_STORE_PASSWORD \
            -alias "$SIGNING_KEY_ALIAS" > /dev/null
          keytool -certreq \
            -keystore "$RUNNER_TEMP/tallybook-release.jks" \
            -storepass:env SIGNING_STORE_PASSWORD \
            -keypass:env SIGNING_KEY_PASSWORD \
            -alias "$SIGNING_KEY_ALIAS" \
            -file /dev/null > /dev/null

      - name: Run JVM tests
        run: >-
          ./gradlew
          :core:model:test
          :core:common:testDebugUnitTest
          :core:data:testDebugUnitTest
          :feature:transactions:testDebugUnitTest
          --stacktrace
          --console=plain

      - name: Build unsigned release APK
        run: >-
          ./gradlew
          :app:assembleRelease
          --stacktrace
          --console=plain

      - name: Package and verify APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$BUILD_VERSION" = "$TAG_VERSION"

          mkdir -p dist
          APK_NAME="TallyBook-${GITHUB_REF_NAME}.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          BUILD_TOOLS_DIR=$(dirname "$APKSIGNER")

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/tallybook-release.jks" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "dist/$APK_NAME" \
            "$RUNNER_TEMP/aligned.apk"

          "$APKSIGNER" verify --verbose "dist/$APK_NAME"

          cd dist
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: TallyBook ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.sha256
