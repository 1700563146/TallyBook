name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM tests, lint and debug APK
        run: >-
          ./gradlew
          :app:lintDebug
          :app:assembleDebug
          :core:model:test
          :core:common:testDebugUnitTest
          :core:data:testDebugUnitTest
          :feature:transactions:testDebugUnitTest

      - name: Verify Room schema snapshots are committed
        run: git diff --exit-code -- core/database/schemas

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Room instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            ./gradlew
            :core:database:connectedDebugAndroidTest
            :core:data:connectedDebugAndroidTest
